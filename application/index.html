<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Taskflow Bold – Student task manager</title>
<script>try{var t=localStorage.getItem('taskflow-bold-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#e6eeff;--card:#fff;--ink:#111;--muted:#505a73;--yellow:#ffd60a;--pink:#ff6fae;--blue:#4a74ff;--green:#2fe6a0;--red:#ff5a4d;--on-y:#111;--bw:3px;--sh:5px 5px 0 var(--ink);color-scheme:light}
:root[data-theme=dark]{--bg:#121216;--card:#1c1c22;--ink:#f4f4f0;--muted:#a3a3b2;--yellow:#e5c100;--pink:#e05a99;--blue:#6b8cff;--green:#27c98a;--red:#ff6a5e;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121216;--card:#1c1c22;--ink:#f4f4f0;--muted:#a3a3b2;--yellow:#e5c100;--pink:#e05a99;--blue:#6b8cff;--green:#27c98a;--red:#ff6a5e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.45 "Archivo",system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(var(--ink) 1px,transparent 1.4px);background-size:22px 22px;background-position:0 0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;z-index:-1}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 130px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{margin-right:auto;padding:6px 14px;background:var(--ink);color:var(--bg);font-weight:900;font-size:22px;letter-spacing:-.04em;transform:rotate(-2deg)}
.logo i{font-style:normal;color:var(--yellow)}
.date{font:700 13px "JetBrains Mono",monospace;color:var(--muted)}
.sq{display:grid;place-items:center;width:44px;height:44px;background:var(--card);border:var(--bw) solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.sq:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.i-sun{display:none}
:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .i-sun{display:block}:root:not([data-theme=light]) .i-moon{display:none}}
.now{position:relative;padding:26px 26px 24px;margin-bottom:26px;background:var(--yellow);color:var(--on-y);border:var(--bw) solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.now .lab{display:inline-block;padding:3px 10px;background:#111;color:var(--yellow);font:700 12px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em}
.now h1{margin:14px 0 18px;font-weight:900;font-size:clamp(28px,6vw,48px);line-height:1.02;letter-spacing:-.04em;overflow-wrap:anywhere}
.meter{display:flex;align-items:center;gap:14px}
.track{flex:1;height:18px;background:#fff;border:var(--bw) solid #111;overflow:hidden}
.fill{height:100%;width:0;background:var(--pink);border-right:var(--bw) solid #111;transition:width .4s}
.meter b{font:700 14px "JetBrains Mono",monospace;white-space:nowrap}
.now-actions{display:flex;gap:10px;margin-top:20px}
.b{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;background:var(--card);color:var(--ink);border:var(--bw) solid #111;box-shadow:4px 4px 0 #111;font-weight:800;transition:transform .1s,box-shadow .1s}
.b:active{transform:translate(4px,4px);box-shadow:none}
.b.dark{background:#111;color:#fff}
.b.pink{background:var(--pink);color:#111}
.quick{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:12px}
.quick input,.quick select,.find input,.modal input,.modal select{padding:13px 14px;background:var(--card);border:var(--bw) solid var(--ink);outline:0;font-weight:600;border-radius:0}
.quick input:focus,.find input:focus,.modal input:focus,.modal select:focus{box-shadow:4px 4px 0 var(--blue)}
.find{margin-bottom:26px}.find input{width:100%;font-size:14px;padding:10px 14px}
.grp{display:flex;align-items:center;gap:10px;margin:28px 0 12px;font-weight:900;font-size:22px;letter-spacing:-.03em}
.grp b{padding:1px 10px;background:var(--ink);color:var(--bg);font:700 13px "JetBrains Mono",monospace}
.grp::after{content:"";flex:1;height:var(--bw);background:var(--ink)}
.list{display:grid;gap:14px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:var(--bw) solid var(--ink);box-shadow:var(--sh);transition:transform .12s,box-shadow .12s}
.row:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.chk{display:grid;place-items:center;width:32px;height:32px;padding:0;background:var(--card);border:var(--bw) solid var(--ink);color:transparent}
.chk svg{width:20px;height:20px;stroke-width:4}
.chk.on{background:var(--green);color:#111}
.t{margin:0;font-weight:800;font-size:18px;letter-spacing:-.02em;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;text-decoration-thickness:3px;color:var(--muted)}
.sub{margin:2px 0 0;font:500 12px "JetBrains Mono",monospace;color:var(--muted)}
.tag{padding:3px 10px;border:2px solid var(--ink);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#111}
.tag.high{background:var(--red)}.tag.medium{background:var(--yellow)}.tag.low{background:var(--green)}
.st{padding:7px 12px;background:none;border:2px dashed var(--ink);font-weight:700;font-size:13px;white-space:nowrap}
.st:hover{background:var(--blue);color:#fff;border-style:solid}
.st.prog{background:var(--blue);color:#fff;border-style:solid}
.edit{display:grid;place-items:center;width:36px;height:36px;background:none;border:0}
.edit:hover{background:var(--ink);color:var(--bg)}
.empty{padding:40px 20px;text-align:center;font-weight:800;font-size:20px;border:var(--bw) dashed var(--ink)}
.empty p{margin:4px 0 0;font:500 14px "Archivo",sans-serif;color:var(--muted)}
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:8px;background:var(--card);border:var(--bw) solid var(--ink);box-shadow:var(--sh)}
.dock button{display:flex;align-items:center;gap:8px;padding:10px 16px;background:none;border:0;font-weight:800}
.dock button b{font:700 12px "JetBrains Mono",monospace;padding:0 6px;background:var(--ink);color:var(--bg)}
.dock button.on{background:var(--pink);color:#111}
.dock button.on b{background:#111;color:#fff}
.dock .plus{background:var(--yellow);color:#111;padding:10px 14px}
.backdrop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:#000a}
.backdrop[hidden]{display:none}
.modal{position:relative;width:100%;max-width:440px;padding:28px;background:var(--bg);border:var(--bw) solid var(--ink);box-shadow:10px 10px 0 var(--yellow)}
.modal h2{margin:0 0 20px;font-weight:900;font-size:30px;letter-spacing:-.04em}
.x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:32px;line-height:1}
.modal label{display:grid;gap:6px;margin-bottom:16px;font:700 12px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acts{display:flex;gap:12px;margin-top:6px}.acts .pink{flex:1;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 18px;background:var(--ink);color:var(--bg);font-weight:800;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.date{display:none}.quick{grid-template-columns:1fr 1fr}.quick input{grid-column:1/-1}.row{grid-template-columns:auto 1fr auto;gap:12px}.row .tag{display:none}.row .st{grid-column:2;justify-self:start}.row .edit{grid-row:1;grid-column:3}.dock button span{display:none}.now{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo">task<i>flow</i></span>
    <span class="date" id="today"></span>
    <button class="sq" id="theme-toggle" aria-label="Switch theme"><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </header>

  <section class="now" aria-label="Focus">
    <span class="lab" id="now-lab">Now</span>
    <h1 id="now-title">Nothing in focus.</h1>
    <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><b id="meter-txt">0/0 done</b></div>
    <div class="now-actions" id="now-actions"></div>
  </section>

  <form class="quick" id="quick" autocomplete="off">
    <input id="quick-title" maxlength="120" placeholder="Add a task and press Enter…" aria-label="New task title" />
    <select id="quick-prio" aria-label="Priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
    <button class="b pink" type="submit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  </form>
  <label class="find"><input id="search-input" type="search" placeholder="Search tasks  (press / )" aria-label="Search tasks" /></label>

  <main id="list" aria-live="polite"></main>
</div>

<nav class="dock" aria-label="Views">
  <button class="on" data-view="all"><span>All</span><b id="n-all">0</b></button>
  <button data-view="focus"><span>Focus</span><b id="n-focus">0</b></button>
  <button data-view="done"><span>Done</span><b id="n-done">0</b></button>
  <button class="plus" id="plus" aria-label="New task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div class="backdrop" id="modal" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="x" data-close-modal aria-label="Close dialog">×</button>
    <h2 id="modal-title">Edit task</h2>
    <form id="task-form">
      <label>Title<input id="title" required maxlength="120" /></label>
      <div class="two">
        <label>Priority<select id="priority"><option>High</option><option>Medium</option><option>Low</option></select></label>
        <label>Status<select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select></label>
      </div>
      <div class="acts"><button type="button" class="b" id="delete-btn" style="color:var(--red)">Delete</button><button class="b pink" type="submit">Save changes</button></div>
    </form>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = 'taskflow-demo-tasks';
const ORDER = ['In Progress', 'Pending', 'Completed'];
const CYCLE = ['Pending', 'In Progress', 'Completed'];
const state = { tasks: [], editingId: null, view: 'all' };
const $ = (s) => document.querySelector(s);
const OK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';

function seed() {
  try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch {}
  return [
    { id: 'T101', title: 'Complete Cloud Computing assignment', priority: 'High', status: 'In Progress', createdDate: '2026-10-28' },
    { id: 'T102', title: 'Prepare project presentation', priority: 'Medium', status: 'Pending', createdDate: '2026-10-26' },
    { id: 'T103', title: 'Submit final year project report', priority: 'High', status: 'Completed', createdDate: '2026-10-21' }
  ];
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state.tasks)); } catch {} };
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
const fmt = (v) => new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric' }).format(new Date(`${v}T00:00:00`));
const api = (p, m, b) => fetch(`/api/tasks${p}`, { method: m, headers: { 'Content-Type': 'application/json' }, body: b && JSON.stringify(b) }).catch(() => {});
const open = (t) => t.status !== 'Completed';
const focusTask = () => state.tasks.find((t) => t.status === 'In Progress') || state.tasks.find((t) => open(t) && t.priority === 'High') || state.tasks.find(open);

function inView(t) { return state.view === 'focus' ? open(t) && t.priority === 'High' : state.view === 'done' ? !open(t) : true; }

function render() {
  const all = state.tasks, n = all.length, done = all.filter((t) => !open(t)).length;
  $('#n-all').textContent = n; $('#n-done').textContent = done;
  $('#n-focus').textContent = all.filter((t) => open(t) && t.priority === 'High').length;
  $('#fill').style.width = n ? `${(done / n) * 100}%` : '0';
  $('#meter-txt').textContent = `${done}/${n} done`;

  const f = focusTask();
  $('#now-lab').textContent = f ? (f.status === 'In Progress' ? 'Now doing' : 'Up next') : n ? 'All clear' : 'Start here';
  $('#now-title').textContent = f ? f.title : n ? 'Everything is done. Go touch grass.' : 'Add your first task below.';
  $('#now-actions').innerHTML = f ? `<button class="b dark" data-complete="${f.id}">${OK}Mark done</button>${f.status === 'Pending' ? `<button class="b" data-start="${f.id}">Start it</button>` : ''}<button class="b" data-edit="${f.id}">Edit</button>` : '';

  const q = $('#search-input').value.trim().toLowerCase();
  const list = all.filter((t) => inView(t) && (!q || t.title.toLowerCase().includes(q) || t.id.toLowerCase().includes(q)));
  const html = ORDER.map((s) => {
    const items = list.filter((t) => t.status === s);
    if (!items.length) return '';
    return `<h2 class="grp">${s}<b>${items.length}</b></h2><div class="list">${items.map((t) => `
      <article class="row ${t.status === 'Completed' ? 'done' : ''}">
        <button class="chk ${t.status === 'Completed' ? 'on' : ''}" data-complete="${t.id}" aria-label="Toggle ${esc(t.title)}">${OK}</button>
        <div><p class="t">${esc(t.title)}</p><p class="sub">${t.id} / ${fmt(t.createdDate)}</p></div>
        <span class="tag ${t.priority.toLowerCase()}">${t.priority}</span>
        <button class="st ${t.status === 'In Progress' ? 'prog' : ''}" data-cycle="${t.id}" title="Change status">${t.status}</button>
        <button class="edit" data-edit="${t.id}" aria-label="Edit ${esc(t.title)}">${PEN}</button>
      </article>`).join('')}</div>`;
  }).join('');
  $('#list').innerHTML = html || `<div class="empty">${q ? 'No matches.' : state.view === 'done' ? 'Nothing finished yet.' : state.view === 'focus' ? 'No urgent tasks.' : 'No tasks yet.'}<p>${q ? 'Try a different search.' : 'Type above and hit Enter to add one.'}</p></div>`;
}

let tt;
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2000); }
function setStatus(id, status) { const t = state.tasks.find((x) => x.id === id); if (!t) return; t.status = status; persist(); render(); api(`/${id}`, 'PUT', { status }); }
function openModal(t) {
  state.editingId = t.id;
  $('#title').value = t.title; $('#priority').value = t.priority; $('#status').value = t.status;
  $('#modal').hidden = false; $('#title').focus();
}
const closeModal = () => { $('#modal').hidden = true; state.editingId = null; };
async function sync() { try { const r = await fetch('/api/tasks'); if (r.ok) { state.tasks = await r.json(); persist(); render(); } } catch {} }

$('#quick').addEventListener('submit', (e) => {
  e.preventDefault();
  const p = { title: $('#quick-title').value.trim(), priority: $('#quick-prio').value, status: 'Pending' };
  if (!p.title) return;
  state.tasks.unshift({ id: `T${Date.now().toString(36).slice(-4).toUpperCase()}`, ...p, createdDate: new Date().toISOString().slice(0, 10) });
  api('', 'POST', p); persist(); $('#quick-title').value = ''; render(); toast('Task added');
});
$('#task-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const p = { title: $('#title').value.trim(), priority: $('#priority').value, status: $('#status').value };
  if (!p.title) return;
  const id = state.editingId;
  state.tasks = state.tasks.map((t) => (t.id === id ? { ...t, ...p } : t));
  api(`/${id}`, 'PUT', p); persist(); render(); closeModal(); toast('Changes saved');
});
$('#delete-btn').addEventListener('click', () => {
  const id = state.editingId; if (!id) return;
  state.tasks = state.tasks.filter((t) => t.id !== id); api(`/${id}`, 'DELETE'); persist(); render(); closeModal(); toast('Task deleted');
});
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-close-modal]') || t === $('#modal')) closeModal();
  const ed = t.closest('[data-edit]'); if (ed) openModal(state.tasks.find((x) => x.id === ed.dataset.edit));
  const c = t.closest('[data-complete]');
  if (c) { const k = state.tasks.find((x) => x.id === c.dataset.complete); if (k) { const s = open(k) ? 'Completed' : 'Pending'; setStatus(k.id, s); toast(s === 'Completed' ? 'Nice. One down.' : 'Task reopened'); } }
  const st = t.closest('[data-start]'); if (st) setStatus(st.dataset.start, 'In Progress');
  const cy = t.closest('[data-cycle]'); if (cy) { const k = state.tasks.find((x) => x.id === cy.dataset.cycle); setStatus(k.id, CYCLE[(CYCLE.indexOf(k.status) + 1) % 3]); }
  const v = t.closest('[data-view]'); if (v) { state.view = v.dataset.view; document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b === v)); render(); }
});
$('#plus').addEventListener('click', () => { scrollTo({ top: 0, behavior: 'smooth' }); $('#quick-title').focus({ preventScroll: true }); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search-input').focus(); }
});
$('#search-input').addEventListener('input', render);
$('#theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('taskflow-bold-theme', next); } catch {}
});

$('#today').textContent = new Intl.DateTimeFormat('en', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' }).format(new Date());
state.tasks = seed(); render(); sync();
</script>
</body>
</html>
